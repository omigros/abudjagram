# Builds the Windows installer and publishes it on the Releases page.
# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0) or by hand from the Actions tab.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # The installer is not code-signed yet; this stops electron-builder from looking for a certificate
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web app
        run: npm run build:production

      - name: Build the customization layer
        run: npm run build:inject

      - name: Package the installer
        run: npx electron-builder --win --publish never

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Abudjagram-Setup-*.exe
          prerelease: true
          body_path: .github/release-notes.md
